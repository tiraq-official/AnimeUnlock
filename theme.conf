[General]

## ---------------------------------------------------------------------------
##  AnimeUnlock — SDDM theme configuration
##  Edit the values below, then restart the greeter to apply:
##      sudo systemctl restart sddm      (or just log out)
## ---------------------------------------------------------------------------

background="assets/background.jpg"
## Wallpaper used on the idle (locked) screen. Path is relative to this theme
## folder. Replace this file with your own wallpaper.

backgroundBlur="assets/background_blur.jpg"
## The blurred wallpaper the screen cross-fades to once you start typing.
## Regenerate it from a new wallpaper with:   python3 make_blur.py

AvatarImage=""
## Round avatar shown in the password bar.
##   empty            -> just the account's initial is shown
##   "assets/avatar.png" or any path -> that picture is used
## If the account has its own ~/.face.icon it is preferred over this.

type="image"
## SDDM standard key, kept for compatibility.

color="#0b1626"
## SDDM standard key, kept for compatibility.

FontFamily=""
## UI font. Empty = the system default. e.g. "Inter" or "Noto Sans".

MonoFontFamily="monospace"
## Font used for the "Type your password to unlock" prompt and the date.

PromptText="Type your password to unlock"
## Text shown on the idle pill.

WeatherText="29° Clear sky"
## Small pill at the top right. Set ShowWeather to false to hide it.

ShowWeather="true"
## "true" or "false".

AlwaysShowPowerButtons="true"
## "true"  -> the suspend / restart / power buttons are always shown.
## "false" -> hide whichever ones SDDM reports it cannot do.
## Keep it true if you preview with `sddm-greeter --test-mode`: there is no
## SDDM daemon in test mode, so it reports every capability as false.

DimBackground="0.10"
## 0..1 darkening overlay on the idle screen. The entry screen always dims
## a little more on top of this.

BlurDuration="320"
## Cross-fade time to the blurred wallpaper, in milliseconds.

ScreenWidth="0"
ScreenHeight="0"
## Leave 0 to use the real screen size. Set e.g. 1920 / 1080 only if you want
## to force a size.
